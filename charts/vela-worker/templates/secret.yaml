{{- if and .Values.server.secret (not .Values.server.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vela-worker.secretName" . }}
  labels:
    {{- include "vela-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.server.existingSecretKey }}: {{ .Values.server.secret | quote }}
{{- end }}
