apiVersion: v1
kind: Service
metadata:
  name: {{ include "vela-worker.fullname" . }}
  labels:
    {{- include "vela-worker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "vela-worker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
